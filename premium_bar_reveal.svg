<svg width="100%" height="40" viewBox="0 0 800 40" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <filter id="glowBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
    </filter>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#4fc3f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4fc3f7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="baseLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#1b3a6b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1b3a6b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1b3a6b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- faint permanent base line, so the bar reads even between sweeps -->
  <rect x="0" y="19" width="800" height="2" rx="1" fill="url(#baseLine)"/>

  <!-- soft blurred glow that sweeps left -> right, infinitely, "revealing" the bar -->
  <rect x="-220" y="0" width="220" height="40" fill="url(#glowGrad)" filter="url(#glowBlur)">
    <animate attributeName="x" values="-220;800" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- crisp thin core line under the glow for a sharper "premium" edge -->
  <rect x="-220" y="19" width="220" height="1.5" rx="0.75" fill="#e6f7ff" opacity="0.9">
    <animate attributeName="x" values="-220;800" dur="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>
