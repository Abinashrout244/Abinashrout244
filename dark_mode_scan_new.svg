  <defs>
    <linearGradient id="scanGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#58e6ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#58e6ff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#58e6ff" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#58e6ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#58e6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="1018" height="477.4" rx="8"/>
    </clipPath>
  </defs>

