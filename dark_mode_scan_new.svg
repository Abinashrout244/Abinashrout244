        stroke="#58e6ff" stroke-width="6" opacity="0.35" filter="url(#glowBlur)">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- card background -->
  <rect x="0.5" y="0.5" width="1018" height="477.4" rx="8" fill="#0d1117" stroke="#30363d"/>

